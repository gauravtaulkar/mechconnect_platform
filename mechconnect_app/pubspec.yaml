name: mechconnect_app
description: MechConnect - find and book a bike mechanic.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  # FIX: added so the login token survives app restarts instead of living
  # only in an in-memory static variable (which previously meant every
  # restart silently logged you out of every authenticated call, even
  # though nothing on screen told you that).
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
